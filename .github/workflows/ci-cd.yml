name: CI and deploy demo

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_id:
        description: Existing 40-character release SHA to redeploy; leave blank for this commit
        required: false
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: Verify application and infrastructure
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out the exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend dependencies
        run: python -m pip install --disable-pip-version-check -e './backend[dev]'

      - name: Start the PostgreSQL fixture
        run: docker compose up --detach --wait postgres

      - name: Verify backend
        run: |
          ./scripts/setup_backend_db.sh
          python -m pytest backend/tests
          ruff check backend scripts
          ruff format --check backend scripts

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Verify frontend
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm test -- --run
          npm run build

      - name: Verify shell and Python release tooling
        run: |
          bash -n scripts/package_release.sh scripts/deploy_release.sh scripts/aws_deploy_remote.sh
          python -m py_compile scripts/cloud_conversation_smoke_test.py

      - name: Verify Terraform
        run: ./scripts/validate_infra.sh

      - name: Verify production container builds
        run: |
          docker build --file backend/Dockerfile --tag pharma-backend:ci .
          docker build --file frontend/Dockerfile --tag pharma-frontend:ci frontend

  deploy:
    name: Deploy immutable release to AWS demo
    needs: verify
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: demo
      url: ${{ vars.APP_URL }}
    concurrency:
      group: pharma-demo-deployment
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out deployment tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select immutable release
        env:
          REQUESTED_RELEASE_ID: ${{ inputs.release_id }}
        run: |
          if [[ -n "$REQUESTED_RELEASE_ID" ]]; then
            release_id="$REQUESTED_RELEASE_ID"
            upload_release=false
          else
            release_id="$GITHUB_SHA"
            upload_release=true
          fi
          if [[ ! "$release_id" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Release ID must be a full lowercase Git commit SHA." >&2
            exit 2
          fi
          echo "RELEASE_ID=$release_id" >> "$GITHUB_ENV"
          echo "UPLOAD_RELEASE=$upload_release" >> "$GITHUB_ENV"

      - name: Assume the AWS deployment role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-session-name: github-${{ github.run_id }}
          unset-current-credentials: true

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Deploy through Systems Manager
        env:
          AWS_RELEASE_BUCKET: ${{ vars.AWS_RELEASE_BUCKET }}
          AWS_INSTANCE_ID: ${{ vars.AWS_INSTANCE_ID }}
          AWS_RUNTIME_SECRET_ARN: ${{ vars.AWS_RUNTIME_SECRET_ARN }}
          AWS_DATA_PREFIX: ${{ vars.AWS_DATA_PREFIX }}
          APP_URL: ${{ vars.APP_URL }}
        run: ./scripts/deploy_release.sh "$RELEASE_ID"

      - name: Run model-backed conversation gate
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          for attempt in 1 2; do
            if python3 scripts/cloud_conversation_smoke_test.py "$APP_URL"; then
              exit 0
            fi
            if [[ "$attempt" -lt 2 ]]; then
              sleep 20
            fi
          done
          exit 1

      - name: Record deployment summary
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          {
            echo "## AWS demo deployment"
            echo
            echo "- Release: \`$RELEASE_ID\`"
            echo "- Application: $APP_URL"
            echo "- Verification: health, session/RLS, and model-backed conversation gates passed"
          } >> "$GITHUB_STEP_SUMMARY"
